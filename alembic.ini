# Alembic configuration for the Universal Agent Platform (Master section 63).
#
# The database URL is resolved at runtime in migrations/env.py from the
# DATABASE_URL environment variable (falling back to the local-first default in
# uap.db.engine). sqlalchemy.url is intentionally left blank here so no
# credentials live in a committed config file.

[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os

# The URL is set programmatically in env.py; this is only a fallback.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
